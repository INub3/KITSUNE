<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in – Google Accounts</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Roboto',sans-serif}
body{background:#202124;display:flex;justify-content:center;align-items:center;height:100vh;color:white}
.container{width:980px;max-width:96vw;min-height:430px;background:#0b0b0b;border-radius:28px;display:flex;padding:48px}
.left{width:45%;display:flex;flex-direction:column}
.logo{width:75px;margin-bottom:30px}
h1{font-size:50px;font-weight:400;margin-bottom:18px}
.subtitle{color:#d9d9d9;font-size:22px}
.right{flex:1;display:flex;justify-content:center;align-items:center}
.form{width:100%}
.input{width:100%;height:58px;background:transparent;border:1px solid #5f6368;border-radius:4px;padding-left:18px;font-size:18px;color:white;outline:none;transition:border .15s}
.input:focus{border:2px solid #8ab4f8}
.link{display:inline-block;margin-top:15px;color:#8ab4f8;text-decoration:none;font-weight:500;font-size:14px}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:90px}
.create{color:#8ab4f8;text-decoration:none;font-weight:500;font-size:14px}
button{width:90px;height:42px;border:none;border-radius:22px;background:#8ab4f8;color:#202124;font-size:15px;cursor:pointer;font-weight:500}
button:hover{opacity:.9}
.step{display:none}.step.active{display:block}
.user-row{display:flex;align-items:center;gap:12px;margin-bottom:24px;background:#1e1e1e;border-radius:24px;padding:8px 16px 8px 8px;cursor:pointer}
.avatar{width:36px;height:36px;border-radius:50%;background:#8ab4f8;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;color:#202124;text-transform:uppercase}
.user-email{font-size:14px;color:#e8eaed}
.chevron{margin-left:auto;color:#9aa0a6;font-size:12px}
.pw-label{font-size:14px;color:#9aa0a6;margin-bottom:16px}
@media(max-width:680px){.container{flex-direction:column;width:100%;border-radius:0;padding:32px 24px;min-height:100vh}.left{width:100%;margin-bottom:32px}h1{font-size:36px}.right{justify-content:flex-start}.bottom{margin-top:60px}}
</style>
</head>
<body>



<div class="container">
  <div class="left">
    <svg class="logo" viewBox="0 0 272 92" xmlns="http://www.w3.org/2000/svg">
      <path d="M115.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18C71.25 34.32 81.24 25 93.5 25s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44S80.99 39.2 80.99 47.18c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z" fill="#EA4335"/>
      <path d="M163.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18c0-12.85 9.99-22.18 22.25-22.18s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44s-12.51 5.46-12.51 13.44c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z" fill="#FBBC05"/>
      <path d="M209.75 26.34v39.82c0 16.38-9.66 23.07-21.08 23.07-10.75 0-17.22-7.19-19.66-13.07l8.48-3.53c1.51 3.61 5.21 7.87 11.17 7.87 7.31 0 11.84-4.51 11.84-13v-3.19h-.34c-2.18 2.69-6.38 5.04-11.68 5.04-11.09 0-21.25-9.66-21.25-22.09 0-12.52 10.16-22.26 21.25-22.26 5.29 0 9.49 2.35 11.68 4.96h.34v-3.61h9.25zm-8.56 20.92c0-7.81-5.21-13.52-11.84-13.52-6.72 0-12.35 5.71-12.35 13.52 0 7.73 5.63 13.36 12.35 13.36 6.63 0 11.84-5.63 11.84-13.36z" fill="#4285F4"/>
      <path d="M225 3v65h-9.5V3h9.5z" fill="#34A853"/>
      <path d="M262.02 54.48l7.56 5.04c-2.44 3.61-8.32 9.83-18.48 9.83-12.6 0-22.01-9.74-22.01-22.18 0-13.19 9.49-22.18 20.92-22.18 11.51 0 17.14 9.16 18.98 14.11l1.01 2.52-29.65 12.28c2.27 4.45 5.8 6.72 10.75 6.72 4.96 0 8.4-2.44 10.92-6.14zm-23.27-7.98l19.82-8.23c-1.09-2.77-4.37-4.7-8.23-4.7-4.95 0-11.84 4.37-11.59 12.93z" fill="#EA4335"/>
      <path d="M35.29 41.41V32H67c.31 1.64.47 3.58.47 5.68 0 7.06-1.93 15.79-8.15 22.01-6.05 6.3-13.78 9.66-24.02 9.66C16.32 69.35.36 53.89.36 34.91.36 15.93 16.32.47 35.3.47c10.5 0 17.98 4.12 23.6 9.49l-6.64 6.64c-4.03-3.78-9.49-6.72-16.97-6.72-13.86 0-24.7 11.17-24.7 25.03 0 13.86 10.84 25.03 24.7 25.03 8.99 0 14.11-3.61 17.39-6.89 2.66-2.66 4.41-6.46 5.1-11.65l-22.49.01z" fill="#4285F4"/>
    </svg>
    <h1>Sign in</h1>
    <p class="subtitle">Use your Google Account</p>
  </div>

  <div class="right">

    <!-- Step 1: Email -->
    <div class="form step active" id="step1">
      <input class="input" id="email-input" type="email"
             placeholder="Email or phone"
             value="{{ prefill }}" autocomplete="email">
      <br>
      <a href="#" class="link">Forgot email?</a>
      <div class="bottom">
        <a href="https://accounts.google.com/signup" class="create">Create account</a>
        <button type="button" onclick="goStep2()">Next</button>
      </div>
    </div>

    <!-- Step 2: Password -->
    <div class="form step" id="step2">
      <div class="user-row" onclick="goStep1()">
        <div class="avatar" id="avatar-letter">U</div>
        <span class="user-email" id="display-email">{{ email }}</span>
        <span class="chevron">▾</span>
      </div>
      <p class="pw-label">To continue, first verify it's you</p>
      <input class="input" id="pw-input" type="password"
             placeholder="Enter your password" autocomplete="current-password">
      <br>
      <a href="#" class="link">Forgot password?</a>
      <div class="bottom">
        <a href="#" class="create">&nbsp;</a>
        <button type="button" onclick="submitCreds()">Next</button>
      </div>
    </div>

  </div>
</div>

<!-- Simulación de concientización: SOLO se envía el token. No se capturan
     credenciales ni ubicación; el POST solo marca que hubo interacción. -->
<form id="capture-form" action="/s/{{ token }}" method="POST" style="display:none">
  <input type="hidden" name="token" id="f-token" value="{{ token }}">
</form>

<script>
function goStep1(){
  document.getElementById('step1').classList.add('active');
  document.getElementById('step2').classList.remove('active');
}
function goStep2(){
  var em = document.getElementById('email-input').value.trim();
  if(!em) return;
  document.getElementById('display-email').textContent = em;
  var letter = em[0] || 'U';
  document.getElementById('avatar-letter').textContent = letter.toUpperCase();
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.add('active');
  setTimeout(function(){ document.getElementById('pw-input').focus(); }, 100);
}
function submitCreds(){
  // No se lee ni envía email/contraseña: solo se registra la interacción (POST del token).
  document.getElementById('capture-form').submit();
}
// Allow Enter key on inputs
document.getElementById('email-input').addEventListener('keydown', function(e){
  if(e.key==='Enter') goStep2();
});
document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && document.getElementById('step2').classList.contains('active')) submitCreds();
});
</script>
</body>
</html>
