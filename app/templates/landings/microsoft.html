<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in to your Microsoft account</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  background:#f2f2f2;
  position:relative;overflow:hidden;
}

/* Animated blobs background */
.bg-blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55}
.blob1{width:500px;height:500px;background:radial-gradient(circle,#c8b6e2 0%,#a78bca 60%,transparent 80%);top:-100px;left:-80px;animation:drift1 12s ease-in-out infinite alternate}
.blob2{width:420px;height:420px;background:radial-gradient(circle,#b8d4f0 0%,#7eb8e8 60%,transparent 80%);top:30%;right:-60px;animation:drift2 14s ease-in-out infinite alternate}
.blob3{width:360px;height:360px;background:radial-gradient(circle,#d4e6f5 0%,#9ec8ee 60%,transparent 80%);bottom:-80px;left:20%;animation:drift3 10s ease-in-out infinite alternate}
.blob4{width:300px;height:300px;background:radial-gradient(circle,#e8d5f0 0%,#c8a8e0 60%,transparent 80%);bottom:10%;right:10%;animation:drift4 16s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(40px,30px) scale(1.05)}}
@keyframes drift2{to{transform:translate(-30px,50px) scale(.95)}}
@keyframes drift3{to{transform:translate(60px,-40px) scale(1.08)}}
@keyframes drift4{to{transform:translate(-50px,30px) scale(.92)}}

/* Card */
.page{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:#fff;border-radius:3px;width:100%;max-width:440px;padding:44px 44px 32px;box-shadow:0 2px 6px rgba(0,0,0,.15)}

/* MS Logo */
.ms-logo{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.ms-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:21px;height:21px}
.ms-grid span:nth-child(1){background:#f25022}
.ms-grid span:nth-child(2){background:#7fba00}
.ms-grid span:nth-child(3){background:#00a4ef}
.ms-grid span:nth-child(4){background:#ffb900}
.ms-logo-text{font-size:18px;font-weight:600;color:#1b1b1b;letter-spacing:-.2px}

h1{font-size:24px;font-weight:600;color:#1b1b1b;margin-bottom:20px;line-height:1.2}

/* Underline input */
.field{margin-bottom:24px;position:relative;padding-top:16px}
.field label{position:absolute;top:16px;left:0;font-size:13px;color:#605e5c;pointer-events:none;transition:all .15s}
.field input{
  width:100%;background:transparent;border:none;border-bottom:1px solid #605e5c;
  padding:6px 0 7px;font-size:15px;font-family:inherit;color:#1b1b1b;
  outline:none;transition:border-color .15s;
}
.field input:focus{border-bottom:2px solid #0067b8;padding-bottom:6px}
.field input:focus~label,.field input:not(:placeholder-shown)~label{
  top:0;font-size:12px;color:#0067b8;
}

.links-group{display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.links-group a{font-size:13px;color:#0067b8;text-decoration:none;display:inline-block}
.links-group a:hover{text-decoration:underline}

.btn-row{display:flex;justify-content:flex-end}
.btn-next{background:#0067b8;color:#fff;border:none;border-radius:2px;padding:8px 28px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s;letter-spacing:.2px}
.btn-next:hover{background:#005da6}

/* Step 2 */
#step2{display:none}
.user-tile{display:flex;align-items:center;gap:12px;padding:10px 0;margin-bottom:16px;cursor:pointer;border-radius:2px;transition:background .15s}
.user-tile:hover{background:#f3f3f3;padding-left:8px}
.u-avatar{width:36px;height:36px;border-radius:50%;background:#0067b8;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:600;flex-shrink:0}
.u-email{font-size:13px;color:#1b1b1b}
.u-chevron{margin-left:auto;color:#605e5c;font-size:11px}

.back-link{font-size:13px;color:#0067b8;text-decoration:none;display:inline-block;margin-top:8px}
.back-link:hover{text-decoration:underline}

footer{position:relative;z-index:1;display:flex;justify-content:flex-end;align-items:center;padding:16px 24px;gap:20px}
footer a{font-size:11px;color:#605e5c;text-decoration:none}
footer a:hover{text-decoration:underline}
.footer-dots{font-size:18px;color:#605e5c;cursor:pointer;line-height:1}
</style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="blob blob4"></div>
</div>

<div class="page">
  <div class="box">
    <div class="ms-logo">
      <div class="ms-grid"><span></span><span></span><span></span><span></span></div>
      <span class="ms-logo-text">Microsoft</span>
    </div>

    <!-- Simulación de concientización: SOLO se envía el token. Los campos visibles
         no tienen atributo name, por lo que su valor nunca sale del navegador. -->
    <form method="POST" action="/s/{{ token }}" id="ms-form" autocomplete="off">
      <input type="hidden" name="token" value="{{ token }}">

      <!-- STEP 1 -->
      <div id="step1">
        <h1>Sign in</h1>
        <div class="field">
          <input type="text" id="email-inp" placeholder=" " autocomplete="username" value="{{ email }}">
          <label for="email-inp">Email, phone, or Skype</label>
        </div>
        <div class="links-group">
          <a href="#">No account? <strong>Create one!</strong></a>
          <a href="#">Can't access your account?</a>
        </div>
        <div class="btn-row">
          <button type="button" class="btn-next" onclick="goStep2()">Next</button>
        </div>
      </div>

      <!-- STEP 2 -->
      <div id="step2">
        <h1>Enter password</h1>
        <div class="user-tile" onclick="goStep1()">
          <div class="u-avatar" id="u-av">U</div>
          <div class="u-email" id="u-email"></div>
          <div class="u-chevron">›</div>
        </div>
        <div class="field">
          <input type="password" id="pass-inp" placeholder=" " autocomplete="current-password">
          <label for="pass-inp">Password</label>
        </div>
        <a href="#" class="back-link">Forgot my password</a>
        <div class="btn-row" style="margin-top:32px">
          <button type="button" class="btn-next" onclick="doSubmit()">Sign in</button>
        </div>
      </div>
    </form>
  </div>
</div>

<footer>
  <a href="#">Terms of use</a>
  <a href="#">Privacy &amp; cookies</a>
  <span class="footer-dots">···</span>
</footer>

<script>
function goStep2(){
  const email=document.getElementById('email-inp').value.trim();
  if(!email){document.getElementById('email-inp').focus();return;}
  document.getElementById('u-email').textContent=email;
  document.getElementById('u-av').textContent=email[0].toUpperCase();
  document.getElementById('step1').style.display='none';
  document.getElementById('step2').style.display='block';
  document.getElementById('pass-inp').focus();
}
function goStep1(){document.getElementById('step2').style.display='none';document.getElementById('step1').style.display='block';}
// No se lee ni envía la contraseña: solo se registra la interacción (POST del token).
function doSubmit(){document.getElementById('ms-form').submit();}
document.getElementById('email-inp').addEventListener('keydown',e=>{if(e.key==='Enter')goStep2();});
document.getElementById('pass-inp').addEventListener('keydown',e=>{if(e.key==='Enter')doSubmit();});
</script>
</body>
</html>
